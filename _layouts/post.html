<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}｜每日閱讀情報</title>

  <style>
  body {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 22px 60px;
    font-family: serif;
    font-size: 20px;
    line-height: 1.85;
    color: #111;
    background: #fff;
  }

  h1 {
    font-size: 1.55em;
    line-height: 1.45;
    margin: 0 0 12px;
    font-weight: 800;
  }

  h2 {
    font-size: 1.28em;
    line-height: 1.5;
    margin-top: 2.1em;
    margin-bottom: 0.8em;
    padding-bottom: 0.32em;
    border-bottom: 1px solid #999;
    font-weight: 800;
  }

  h3 {
    font-size: 1.12em;
    line-height: 1.55;
    margin-top: 1.55em;
    margin-bottom: 0.55em;
    font-weight: 700;
  }

  main p {
    margin: 0.95em 0;
    text-indent: 2em;
  }

  main h1 + p,
  main h2 + p,
  main h3 + p {
    margin-top: 0.75em;
  }

  .meta {
    font-size: 0.85em;
    margin-bottom: 1.8em;
    text-indent: 0;
  }

  blockquote {
    margin: 1.5em 0;
    padding-left: 1em;
    border-left: 3px solid #777;
  }

  blockquote p,
  li p {
    text-indent: 0;
  }

  strong {
    font-weight: 800;
  }

  ul, ol {
    padding-left: 1.5em;
  }

  li {
    margin: 0.45em 0;
  }

  a {
    color: inherit;
    text-decoration: underline;
  }

  hr {
    border: 0;
    border-top: 1px solid #aaa;
    margin: 2em 0;
  }
</style>
</head>

<body>

<header>
  <div class="meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.category %}｜{{ page.category }}{% endif %}
  </div>

  <h1>{{ page.title }}</h1>
</header>

<main>
  {{ content }}
</main>

</body>
</html>
